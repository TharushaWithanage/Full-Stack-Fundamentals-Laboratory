
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">My To-Do List</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5">

        <h1 class="text-center mb-4">My Tasks</h1>

        <!-- Task Input -->
        <div class="row g-2 mb-3">
            <div class="col">
                <input
                    type="text"
                    id="taskInput"
                    class="form-control"
                    placeholder="Enter a new task">
            </div>

            <div class="col-auto">
                <button id="addTaskBtn" class="btn btn-primary">
                    Add Task
                </button>
            </div>
        </div>

        <!-- Error Message -->
        <p id="errorMessage" class="text-danger"></p>

        <!-- Filters -->
        <div class="btn-group mb-3" role="group">
            <button class="btn btn-outline-primary filter-btn active"
                    data-filter="all">All</button>

            <button class="btn btn-outline-primary filter-btn"
                    data-filter="active">Active</button>

            <button class="btn btn-outline-primary filter-btn"
                    data-filter="completed">Completed</button>
        </div>

        <!-- Task List -->
        <ul id="taskList" class="list-group mb-3"></ul>

        <!-- Task Counter and Clear Button -->
        <div class="d-flex justify-content-between align-items-center">
            <span id="taskCounter">0 tasks remaining</span>

            <button id="clearCompletedBtn" class="btn btn-danger btn-sm">
                Clear Completed
            </button>
        </div>

    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
